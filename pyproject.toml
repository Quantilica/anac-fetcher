[project]
name = "anac-fetcher"
version = "0.2.0"
description = "A commandline utility to download ANAC (Agência Nacional de Aviação Civil) open data"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["anac", "aviacao", "aeronautica", "brazil", "open-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.3.2",
]

[project.urls]
Homepage = "https://github.com/Quantilica/anac-fetcher"
Repository = "https://github.com/Quantilica/anac-fetcher"
Issues = "https://github.com/Quantilica/anac-fetcher/issues"

[project.scripts]
anac-fetcher = "anac_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
anac = "anac_fetcher.plugin:app"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/anac_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
